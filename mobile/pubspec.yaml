name: orbit_operator
description: Orbit Operator — aplicativo de campo do Orbit Operations ERP.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1

  # Navegação
  go_router: ^14.6.2

  # Rede
  dio: ^5.7.0

  # Armazenamento
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Captura de evidências
  image_picker: ^1.1.2
  file_picker: ^10.0.0

  # Localização
  geolocator: ^13.0.2

  # Fila de uploads (persistência e rede)
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0

  # Hash de evidências (SHA-256 sobre os bytes exatos enviados)
  crypto: ^3.0.6

  # Versão real do build — o servidor guarda para saber qual app o aparelho
  # está rodando quando um push falha.
  package_info_plus: ^8.1.1

  # Utilidades
  intl: ^0.19.0
  mobile_scanner: ^7.4.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

  # Tipografia da marca, a mesma do produto web (Inter + Space Grotesk).
  # Empacotada de propósito: declarar uma família sem embarcar o arquivo faz o
  # iOS cair calado na fonte do sistema, e o app deixa de parecer o produto.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
