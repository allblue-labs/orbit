name: orbit

services:
  postgres:
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    image: ${POSTGRES_IMAGE:-postgres:17.11-alpine3.24@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - orbit_private
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  api:
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 3g
    cpus: 4
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=536870912,uid=1001,gid=1001,mode=1777
    image: ${ORBIT_API_IMAGE:-docker.io/allbluelabs/orbit-api:${ORBIT_VERSION:?ORBIT_VERSION is required}-api}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 5001
      HOST: ${API_HOST:-0.0.0.0}
      # O processo HTTP não recebe credenciais administrativas do banco.
      DATABASE_URL: postgresql://${APP_DATABASE_USER:-orbit_app}:${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}@postgres:5432/${POSTGRES_DB}?schema=public
      # Papel restrito (PR-26.6): sem SUPERUSER e sem BYPASSRLS. É com ele que
      # as políticas de RLS passam a ser efetivamente avaliadas.
      APP_DATABASE_URL: postgresql://${APP_DATABASE_USER:-orbit_app}:${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}@postgres:5432/${POSTGRES_DB}?schema=public
      # Subir com um papel que contorna RLS passa a ser erro, não aviso.
      DATABASE_ENFORCE_RESTRICTED_ROLE: "true"
      # Transações e pool (PR-26.6.1). A janela conta tempo de parede desde o
      # BEGIN, e o processo renderiza PDF de forma síncrona — os 5 s padrão do
      # Prisma expiravam por trabalho alheio.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      DATABASE_TRANSACTION_TIMEOUT_MS: ${DATABASE_TRANSACTION_TIMEOUT_MS:-20000}
      DATABASE_TRANSACTION_MAX_WAIT_MS: ${DATABASE_TRANSACTION_MAX_WAIT_MS:-10000}
      LOG_CLIENT_ERRORS: ${LOG_CLIENT_ERRORS:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      # Segredo long-lived do antiabuso de trials. Não compartilha rotação com
      # JWT/AES e não possui fallback.
      TRIAL_FINGERPRINT_SECRET: ${TRIAL_FINGERPRINT_SECRET:?TRIAL_FINGERPRINT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-orbit-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-orbit}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:?TRUSTED_PROXY_SECRET is required}
      AUTH_RATE_LIMIT_SECRET: ${AUTH_RATE_LIMIT_SECRET:?AUTH_RATE_LIMIT_SECRET is required}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      AUTH_RATE_LIMIT_ORIGIN_MAX: ${AUTH_RATE_LIMIT_ORIGIN_MAX:-120}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      STORAGE_PROVIDER: R2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-orbit-assets}
      R2_PRIVATE_BUCKET_NAME: ${R2_PRIVATE_BUCKET_NAME:-orbit-assets-private}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      R2_LEGACY_PRIVATE_BUCKETS: ${R2_LEGACY_PRIVATE_BUCKETS:-orbit-artifacts,documents}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://cdn-orbit.allblue-labs.com}
      STORAGE_PUBLIC_API_URL: ${STORAGE_PUBLIC_API_URL:-https://orbit.allblue-labs.com/api/v1}
      STORAGE_SIGNED_URL_TTL_SECONDS: ${STORAGE_SIGNED_URL_TTL_SECONDS:-300}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      IDENTITY_PUBLIC_WEB_URL: ${IDENTITY_PUBLIC_WEB_URL:-}
      CUSTOMER_PORTAL_ENABLED: "false"
      # Billing is an explicit optional subsystem. Disabled mode does not need
      # provider credentials; enabled mode validates every value at startup.
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ESSENTIAL_MONTHLY: ${STRIPE_PRICE_ESSENTIAL_MONTHLY:-}
      STRIPE_PRICE_ESSENTIAL_SEMIANNUAL: ${STRIPE_PRICE_ESSENTIAL_SEMIANNUAL:-}
      STRIPE_PRICE_ESSENTIAL_ANNUAL: ${STRIPE_PRICE_ESSENTIAL_ANNUAL:-}
      STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${STRIPE_PRICE_PROFESSIONAL_MONTHLY:-}
      STRIPE_PRICE_PROFESSIONAL_SEMIANNUAL: ${STRIPE_PRICE_PROFESSIONAL_SEMIANNUAL:-}
      STRIPE_PRICE_PROFESSIONAL_ANNUAL: ${STRIPE_PRICE_PROFESSIONAL_ANNUAL:-}
      STRIPE_PRICE_PROFESSIONAL_INTELLIGENCE_MONTHLY: ${STRIPE_PRICE_PROFESSIONAL_INTELLIGENCE_MONTHLY:-}
      STRIPE_PRICE_PROFESSIONAL_INTELLIGENCE_SEMIANNUAL: ${STRIPE_PRICE_PROFESSIONAL_INTELLIGENCE_SEMIANNUAL:-}
      STRIPE_PRICE_PROFESSIONAL_INTELLIGENCE_ANNUAL: ${STRIPE_PRICE_PROFESSIONAL_INTELLIGENCE_ANNUAL:-}
      STRIPE_PRICE_ENTERPRISE_UNLIMITED_MONTHLY: ${STRIPE_PRICE_ENTERPRISE_UNLIMITED_MONTHLY:-}
      STRIPE_PRICE_ENTERPRISE_UNLIMITED_SEMIANNUAL: ${STRIPE_PRICE_ENTERPRISE_UNLIMITED_SEMIANNUAL:-}
      STRIPE_PRICE_ENTERPRISE_UNLIMITED_ANNUAL: ${STRIPE_PRICE_ENTERPRISE_UNLIMITED_ANNUAL:-}
      BILLING_CHECKOUT_SUCCESS_URL: ${BILLING_CHECKOUT_SUCCESS_URL:-}
      BILLING_CHECKOUT_CANCEL_URL: ${BILLING_CHECKOUT_CANCEL_URL:-}
      BILLING_PORTAL_RETURN_URL: ${BILLING_PORTAL_RETURN_URL:-}
      BILLING_EVENTS_WORKER_ENABLED: ${BILLING_EVENTS_WORKER_ENABLED:-true}
      BILLING_EVENTS_POLL_INTERVAL_MS: ${BILLING_EVENTS_POLL_INTERVAL_MS:-2000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # Firebase Admin sends natively; credentials stay only in the API/worker.
      PUSH_PROVIDER: ${PUSH_PROVIDER:-disabled}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      PUSH_GATEWAY_URL: ${PUSH_GATEWAY_URL:-}
      PUSH_GATEWAY_CREDENTIAL: ${PUSH_GATEWAY_CREDENTIAL:-}
      JOBS_WORKER_ENABLED: ${JOBS_WORKER_ENABLED:-true}
      JOBS_POLL_INTERVAL_MS: ${JOBS_POLL_INTERVAL_MS:-2000}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@orbit.local}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-6001}:5001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - orbit_private
      - orbit_public
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  migrate:
    mem_limit: 2g
    pids_limit: 512
    image: ${ORBIT_MIGRATOR_IMAGE:-docker.io/allbluelabs/orbit-api:${ORBIT_VERSION:?ORBIT_VERSION is required}-migrator}
    restart: "no"
    environment:
      NODE_ENV: production
      # Migrations e provisionamento rodam com a credencial administrativa —
      # é a única que pode criar papel, conceder e alterar schema.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      APP_DATABASE_USER: ${APP_DATABASE_USER:-orbit_app}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orbit_private
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  # Ação administrativa explícita. Nunca é executada por `compose up` normal.
  bootstrap-admin:
    profiles: [admin]
    image: ${ORBIT_MIGRATOR_IMAGE:-docker.io/allbluelabs/orbit-api:${ORBIT_VERSION:?ORBIT_VERSION is required}-migrator}
    restart: "no"
    command: ["node", "dist/src/scripts/seed-platform-admin.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_ADMIN_FIRST_NAME: ${PLATFORM_ADMIN_FIRST_NAME:-Platform}
      PLATFORM_ADMIN_LAST_NAME: ${PLATFORM_ADMIN_LAST_NAME:-Administrator}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [orbit_private]
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  frontend:
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 1536m
    cpus: 2
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=134217728,uid=1001,gid=1001,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,size=268435456,uid=1001,gid=1001,mode=0755
    image: ${ORBIT_FRONTEND_IMAGE:-docker.io/allbluelabs/orbit-api:${ORBIT_VERSION:?ORBIT_VERSION is required}-frontend}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      ORBIT_API_URL: http://api:5001/api/v1
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:?TRUSTED_PROXY_SECRET is required}
      # Links públicos do app mobile, configuráveis sem rebuild da imagem.
      ORBIT_MOBILE_PLAY_STORE_URL: ${ORBIT_MOBILE_PLAY_STORE_URL:-https://example.com/orbit/android}
      ORBIT_MOBILE_APP_STORE_URL: ${ORBIT_MOBILE_APP_STORE_URL:-https://example.com/orbit/ios}
      # Origem pública canônica usada pela proteção same-origin do BFF. Não é
      # inferida do host interno do container/reverse proxy.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:?AUTH_COOKIE_SECURE is required}
      # Exclusivo para smoke local em HTTP. Produção pública deve omitir ou
      # manter false, sempre com AUTH_COOKIE_SECURE=true.
      ALLOW_INSECURE_LOCAL_COOKIES: ${ALLOW_INSECURE_LOCAL_COOKIES:-false}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-7070}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - orbit_public
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  operation_attachments:
  generated_documents:
  artifact_objects:

networks:
  orbit_private:
    internal: true
  orbit_public:
