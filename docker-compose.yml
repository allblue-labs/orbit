name: orbit

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - orbit_private
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
      args:
        ORBIT_COMMIT_SHA: ${ORBIT_COMMIT_SHA:?ORBIT_COMMIT_SHA is required}
        ORBIT_BUILD_TIME: ${ORBIT_BUILD_TIME:?ORBIT_BUILD_TIME is required}
    image: orbit-api:${ORBIT_VERSION:?ORBIT_VERSION is required}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 5001
      HOST: ${API_HOST:-0.0.0.0}
      # Credencial administrativa: continua disponível porque scripts de
      # manutenção (seed do administrador global, templates) a usam. O runtime
      # conecta pela APP_DATABASE_URL.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Papel restrito (PR-26.6): sem SUPERUSER e sem BYPASSRLS. É com ele que
      # as políticas de RLS passam a ser efetivamente avaliadas.
      APP_DATABASE_URL: postgresql://${APP_DATABASE_USER:-orbit_app}:${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}@postgres:5432/${POSTGRES_DB}?schema=public
      # Subir com um papel que contorna RLS passa a ser erro, não aviso.
      DATABASE_ENFORCE_RESTRICTED_ROLE: "true"
      # Transações e pool (PR-26.6.1). A janela conta tempo de parede desde o
      # BEGIN, e o processo renderiza PDF de forma síncrona — os 5 s padrão do
      # Prisma expiravam por trabalho alheio.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      DATABASE_TRANSACTION_TIMEOUT_MS: ${DATABASE_TRANSACTION_TIMEOUT_MS:-20000}
      DATABASE_TRANSACTION_MAX_WAIT_MS: ${DATABASE_TRANSACTION_MAX_WAIT_MS:-10000}
      LOG_CLIENT_ERRORS: ${LOG_CLIENT_ERRORS:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      # Segredo long-lived do antiabuso de trials. Não compartilha rotação com
      # JWT/AES e não possui fallback.
      TRIAL_FINGERPRINT_SECRET: ${TRIAL_FINGERPRINT_SECRET:?TRIAL_FINGERPRINT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-orbit-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-orbit}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
      OPERATION_UPLOAD_DIR: /app/storage/operations
      DOCUMENT_STORAGE_DIR: /app/storage/documents
      # Objetos do Storage Provider (PR-19). Sem volume, os documentos emitidos
      # morrem no primeiro rebuild da imagem — o manifest continua apontando
      # para um arquivo que não existe mais.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-LOCAL}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-orbit-artifacts}
      STORAGE_LOCAL_DIR: /app/storage/objects
      # A URL pública do storage segue a porta publicada, não uma fixa: a API é
      # exposta em ${API_PORT}, e era 5001 aqui enquanto o mapeamento acima
      # dizia 6001. O endereço assinado que a API devolvia apontava para a porta
      # interna do container e não era alcançável do host — o upload do smoke de
      # RVT falhava com ECONNREFUSED.
      STORAGE_LOCAL_PUBLIC_URL: ${STORAGE_LOCAL_PUBLIC_URL:-http://localhost:${API_PORT:-5001}/api/v1}
      STORAGE_SIGNED_URL_TTL_SECONDS: ${STORAGE_SIGNED_URL_TTL_SECONDS:-300}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      IDENTITY_PUBLIC_WEB_URL: ${IDENTITY_PUBLIC_WEB_URL:-}
      CUSTOMER_PORTAL_ENABLED: "false"
      # Billing is an explicit optional subsystem. Disabled mode does not need
      # provider credentials; enabled mode validates every value at startup.
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ESSENTIAL_MONTHLY: ${STRIPE_PRICE_ESSENTIAL_MONTHLY:-}
      STRIPE_PRICE_ESSENTIAL_SEMIANNUAL: ${STRIPE_PRICE_ESSENTIAL_SEMIANNUAL:-}
      STRIPE_PRICE_ESSENTIAL_ANNUAL: ${STRIPE_PRICE_ESSENTIAL_ANNUAL:-}
      STRIPE_PRICE_PROFESSIONAL_MONTHLY: ${STRIPE_PRICE_PROFESSIONAL_MONTHLY:-}
      STRIPE_PRICE_PROFESSIONAL_SEMIANNUAL: ${STRIPE_PRICE_PROFESSIONAL_SEMIANNUAL:-}
      STRIPE_PRICE_PROFESSIONAL_ANNUAL: ${STRIPE_PRICE_PROFESSIONAL_ANNUAL:-}
      STRIPE_PRICE_PROFESSIONAL_INTELLIGENCE_MONTHLY: ${STRIPE_PRICE_PROFESSIONAL_INTELLIGENCE_MONTHLY:-}
      STRIPE_PRICE_PROFESSIONAL_INTELLIGENCE_SEMIANNUAL: ${STRIPE_PRICE_PROFESSIONAL_INTELLIGENCE_SEMIANNUAL:-}
      STRIPE_PRICE_PROFESSIONAL_INTELLIGENCE_ANNUAL: ${STRIPE_PRICE_PROFESSIONAL_INTELLIGENCE_ANNUAL:-}
      STRIPE_PRICE_ENTERPRISE_UNLIMITED_MONTHLY: ${STRIPE_PRICE_ENTERPRISE_UNLIMITED_MONTHLY:-}
      STRIPE_PRICE_ENTERPRISE_UNLIMITED_SEMIANNUAL: ${STRIPE_PRICE_ENTERPRISE_UNLIMITED_SEMIANNUAL:-}
      STRIPE_PRICE_ENTERPRISE_UNLIMITED_ANNUAL: ${STRIPE_PRICE_ENTERPRISE_UNLIMITED_ANNUAL:-}
      BILLING_CHECKOUT_SUCCESS_URL: ${BILLING_CHECKOUT_SUCCESS_URL:-}
      BILLING_CHECKOUT_CANCEL_URL: ${BILLING_CHECKOUT_CANCEL_URL:-}
      BILLING_PORTAL_RETURN_URL: ${BILLING_PORTAL_RETURN_URL:-}
      BILLING_EVENTS_WORKER_ENABLED: ${BILLING_EVENTS_WORKER_ENABLED:-true}
      BILLING_EVENTS_POLL_INTERVAL_MS: ${BILLING_EVENTS_POLL_INTERVAL_MS:-2000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Orbit <no-reply@orbit.local>}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@orbit.local}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?PLATFORM_ADMIN_EMAIL is required}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?PLATFORM_ADMIN_PASSWORD is required}
      PLATFORM_ADMIN_FIRST_NAME: ${PLATFORM_ADMIN_FIRST_NAME:?PLATFORM_ADMIN_FIRST_NAME is required}
      PLATFORM_ADMIN_LAST_NAME: ${PLATFORM_ADMIN_LAST_NAME:?PLATFORM_ADMIN_LAST_NAME is required}
    ports:
      - "0.0.0.0:${API_PORT:-5001}:5001"
    volumes:
      - operation_attachments:/app/storage/operations
      - generated_documents:/app/storage/documents
      - artifact_objects:/app/storage/objects
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - orbit_private
      - orbit_public
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrator
      args:
        ORBIT_COMMIT_SHA: ${ORBIT_COMMIT_SHA:?ORBIT_COMMIT_SHA is required}
        ORBIT_BUILD_TIME: ${ORBIT_BUILD_TIME:?ORBIT_BUILD_TIME is required}
    image: orbit-api-migrator:${ORBIT_VERSION:?ORBIT_VERSION is required}
    restart: "no"
    environment:
      NODE_ENV: production
      # Migrations e provisionamento rodam com a credencial administrativa —
      # é a única que pode criar papel, conceder e alterar schema.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      APP_DATABASE_USER: ${APP_DATABASE_USER:-orbit_app}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orbit_private
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        ORBIT_COMMIT_SHA: ${ORBIT_COMMIT_SHA:?ORBIT_COMMIT_SHA is required}
        ORBIT_BUILD_TIME: ${ORBIT_BUILD_TIME:?ORBIT_BUILD_TIME is required}
    image: orbit-frontend:${ORBIT_VERSION:?ORBIT_VERSION is required}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      ORBIT_API_URL: http://api:5001/api/v1
      # Origem pública canônica usada pela proteção same-origin do BFF. Não é
      # inferida do host interno do container/reverse proxy.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:?AUTH_COOKIE_SECURE is required}
      # Exclusivo para smoke local em HTTP. Produção pública deve omitir ou
      # manter false, sempre com AUTH_COOKIE_SECURE=true.
      ALLOW_INSECURE_LOCAL_COOKIES: ${ALLOW_INSECURE_LOCAL_COOKIES:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - orbit_public
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  operation_attachments:
  generated_documents:
  artifact_objects:

networks:
  orbit_private:
    internal: true
  orbit_public:
