server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name orbit.allblue-labs.com;
    return 308 https://orbit.allblue-labs.com$request_uri;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name orbit.allblue-labs.com;
    ssl_certificate /etc/nginx/ssl/orbit-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/orbit-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:orbit_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    # Next.js mantém suas próprias políticas de frame/CSP por rota (termos).
    access_log /var/log/nginx/orbit-access.log orbit;
    error_log /var/log/nginx/orbit-error.log warn;
    client_max_body_size 50m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;
    limit_conn orbit_connections 50;
    limit_req_status 429;

    location ~ /(?:\.[^/]*|node_modules)(?:/|$) { return 404; }
    location = /health/live { return 404; }
    location = /health/ready { return 404; }
    location = /api/v1/docs { return 404; }
    location ^~ /api/v1/docs/ { return 404; }
    # Socket.IO legado não faz parte dos canais HTTP/mobile em produção.
    location ^~ /socket.io { return 404; }

    # Preserva /api/v1: API mobile, storage assinado e webhooks.
    location ~ ^/api/v1/identity/(?:login|register|forgot-password|reset-password)(?:/|$) {
        limit_req zone=orbit_auth burst=10 nodelay;
        include /etc/nginx/orbit-proxy.inc;
        proxy_pass http://orbit_api;
    }
    location /api/v1/ {
        include /etc/nginx/orbit-proxy.inc;
        proxy_pass http://orbit_api;
    }
    # /api/orbit, /api/auth, /api/cep e /api/cnpj são BFFs do Next.js.
    location ~ ^/api/(?:auth|orbit/identity)/(?:login|register|forgot-password|reset-password)(?:/|$) {
        limit_req zone=orbit_auth burst=10 nodelay;
        include /etc/nginx/orbit-proxy.inc;
        proxy_pass http://orbit_web;
    }
    location / {
        include /etc/nginx/orbit-proxy.inc;
        proxy_pass http://orbit_web;
    }
}
