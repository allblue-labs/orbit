# Incluído no contexto http por nginx.conf. Nunca registre query strings:
# links de assinatura, recuperação de senha e storage carregam tokens nelas.
log_format orbit '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                 '$status $body_bytes_sent rt=$request_time upstream=$upstream_status';
server_tokens off;
limit_req_zone $binary_remote_addr zone=orbit_auth:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=orbit_connections:10m;

# Confiar apenas nos intervalos oficiais da Cloudflare, instalados pelo script.
include /etc/nginx/cloudflare-realip.conf;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

upstream orbit_web {
    server 127.0.0.1:7070;
    keepalive 32;
}
upstream orbit_api {
    server 127.0.0.1:6001;
    keepalive 32;
}
