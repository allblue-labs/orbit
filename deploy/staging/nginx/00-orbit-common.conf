# Incluído no contexto http por nginx.conf. Nunca registre query strings:
# links de assinatura, recuperação de senha e storage carregam tokens nelas.
map $uri $orbit_log_path {
    ~*^(/(?:api/(?:v1|orbit)/)?(?:public/quotes/proposals|public/pmoc/contracts|assets/qr|proposta|contrato|q))/[^/]+(.*)$ $1/[redacted];
    default /orbit;
}
map $http_x_request_id $orbit_legacy_id {
    "~*^(?:[a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$" $http_x_request_id;
    default $request_id;
}
map $http_x_correlation_id $orbit_correlation_id {
    "~*^(?:[a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$" $http_x_correlation_id;
    default $orbit_legacy_id;
}
log_format orbit escape=json '{"timestamp":"$time_iso8601","level":"info","processRole":"edge",'
                             '"event":"http_ingress","correlationId":"$orbit_correlation_id",'
                             '"organizationId":null,"userId":null,"durationMs":null,'
                             '"durationSeconds":$request_time,"method":"$request_method","route":"$orbit_log_path","status":$status}';
server_tokens off;
limit_req_zone $binary_remote_addr zone=orbit_auth:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=orbit_connections:10m;

# Confiar apenas nos intervalos oficiais da Cloudflare, instalados pelo script.
include /etc/nginx/cloudflare-realip.conf;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

upstream orbit_web {
    server 127.0.0.1:7070;
    keepalive 32;
}
upstream orbit_api {
    server 127.0.0.1:6001;
    keepalive 32;
}
