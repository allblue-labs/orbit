services:
  api:
    environment: &staging-storage
      ORBIT_DEPLOYMENT: staging
      STORAGE_PROVIDER: LOCAL
      STORAGE_LOCAL_DIR: /app/staging-media
      STORAGE_BUCKET: orbit-assets-private
      STORAGE_LOCAL_BRAND_BUCKET: orbit-assets
      R2_ACCOUNT_ID: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET_NAME: ""
      R2_PRIVATE_BUCKET_NAME: ""
      R2_ENDPOINT: ""
      R2_LEGACY_PRIVATE_BUCKETS: ""
      R2_PUBLIC_URL: ""
      CLOUDFLARE_CACHE_PURGE_ZONE_ID: ""
      CLOUDFLARE_CACHE_PURGE_TOKEN: ""
    volumes: &staging-media
      - staging_media:/app/staging-media
  worker:
    environment: *staging-storage
    volumes: *staging-media
  documents:
    environment: *staging-storage
    volumes: *staging-media

volumes:
  staging_media:
