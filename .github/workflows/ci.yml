name: Orbit verification

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm run lint && npm run typecheck && npm run lint:public-errors && npm run contracts:guard
        working-directory: backend
      - run: node --test scripts/audit-policy.test.mjs
      - run: npm run security:audit
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm test -- --runInBand --watchman=false
        working-directory: backend
      # Creates its own PostgreSQL, bootstraps orbit_app, applies every migration,
      # seeds catalogues, enforces the restricted runtime role and always cleans up.
      - run: npm run test:e2e
        working-directory: backend

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run security:audit && npm run lint && npm run typecheck && npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Includes a production Next build and a real, isolated Nest/Postgres stack.
      - run: npm run test:e2e
        working-directory: frontend

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.2"
          channel: stable
      - run: npm ci
        working-directory: backend
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - run: flutter analyze --fatal-infos
        working-directory: mobile
      # The visual scenarios retain their behavioral assertions; recording PNGs
      # is a separate manual tool and cannot silently accept a changed baseline.
      - run: flutter test --exclude-tags integration
        working-directory: mobile
      - run: node scripts/verify-integrations.mjs mobile
      - run: flutter build apk --debug --dart-define=ORBIT_API_URL=https://orbit.allblue-labs.com/api/v1
        working-directory: mobile
